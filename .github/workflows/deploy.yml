name: Deploy Extrabotics Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build clean URLs
        shell: bash
        run: |
          set -e

          mkdir -p _site

          # Copy everything to the build directory
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

          # Create clean URL folders for every HTML page
          find . -maxdepth 1 -type f -name "*.html" ! -name "index.html" | while read file; do
            filename=$(basename "$file")
            name="${filename%.html}"

            mkdir -p "_site/$name"

            # Copy the HTML page into its clean URL folder
            cp "$file" "_site/$name/index.html"

            # Add a base URL so relative CSS, JS, images, etc. still work
            sed -i 's|<head>|<head><base href="/">|' "_site/$name/index.html"
          done

          echo "Clean URLs created:"
          find _site -mindepth 2 -maxdepth 2 -name index.html -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
