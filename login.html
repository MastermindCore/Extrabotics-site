<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Extrabotics Academy</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Auth-specific styles */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px;
            position: relative;
        }

        .auth-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 198, 255, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        .auth-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
            border: 1px solid #f0f0f0;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 16px 16px 0 0;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #666;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .auth-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .auth-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 0.9rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .auth-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }

        .auth-divider span {
            background: white;
            padding: 0 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            color: #666;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-message {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .auth-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .auth-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .password-strength {
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #28a745; width: 100%; }

        @media (max-width: 768px) {
            .auth-card {
                padding: 2rem;
            }
            
            .auth-header h2 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem;
            }
            
            .auth-container {
                padding: 80px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index" class="logo glitch-effect">Extrabotics Academy</a>
            <ul class="nav-menu">
                <li><a href="index" class="nav-link">Home</a></li>
                <li><a href="about" class="nav-link">About</a></li>
                <li><a href="events" class="nav-link">Events</a></li>
                <li><a href="contact" class="nav-link">Contact</a></li>
                <li><a href="login" class="nav-link active">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-background"></div>
        
        <div class="auth-card fade-in-up">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your learning dashboard</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" onclick="switchTab('signup')">Sign Up</div>
            </div>

            <!-- Messages -->
            <div id="authMessage" class="auth-message"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>

                <button type="submit" class="auth-btn" id="loginBtn">
                    <span>Sign In</span>
                    <span class="loading" style="display: none;">Signing in...</span>
                </button>

                <div class="auth-footer">
                    <a href="forgot-password">Forgot Password?</a>
                </div>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form">
                <!-- FIX: Added full name field -->
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" required placeholder="Your full name">
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" required oninput="checkPasswordStrength()">
                    <div class="password-strength">
                        <div id="passwordStrengthBar" class="password-strength-bar"></div>
                    </div>
                    <small style="color: #666; margin-top: 5px; display: block;">
                        Must be at least 8 characters with uppercase, lowercase, and numbers
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required oninput="checkPasswordMatch()">
                    <small id="passwordMatch" style="color: #666; margin-top: 5px; display: block;"></small>
                </div>

                <button type="submit" class="auth-btn" id="signupBtn">
                    <span>Create Account</span>
                    <span class="loading" style="display: none;">Creating account...</span>
                </button>

                <div class="auth-footer">
                    By signing up, you agree to our <a href="terms">Terms & Conditions</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAPHFEqG4ubx2Vr37IqO29V4viKyjS9_7c",
            authDomain: "extraboticse-learningplatform.firebasestorage.app",
            projectId: "extraboticse-learningplatform",
            storageBucket: "extraboticse-learningplatform.firebasestorage.app",
            messagingSenderId: "830727009236",
            appId: "1:830727009236:web:c432d6483525937eb81c41",
            measurementId: "G-EL56YHSGVL"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // FIX: Flag to prevent onAuthStateChanged from redirecting mid-form-submit
        let isHandlingFormSubmit = false;

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            document.querySelector(`.auth-tab[onclick*="${tab}"]`).classList.add('active');
            document.getElementById(`${tab}Form`).classList.add('active');
            
            document.getElementById('authMessage').className = 'auth-message';
            document.getElementById('authMessage').textContent = '';
        }

        // Password Strength Checker
        function checkPasswordStrength() {
            const password = document.getElementById('signupPassword').value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 4) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        }

        // Password Match Checker
        function checkPasswordMatch() {
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const matchText = document.getElementById('passwordMatch');
            
            if (confirm.length === 0) {
                matchText.textContent = '';
            } else if (password === confirm) {
                matchText.textContent = '✓ Passwords match';
                matchText.style.color = '#28a745';
            } else {
                matchText.textContent = '✗ Passwords do not match';
                matchText.style.color = '#dc3545';
            }
        }

        // Show/Hide Loading State
        function setLoading(button, isLoading) {
            const spans = button.querySelectorAll('span');
            spans[0].style.display = isLoading ? 'none' : 'inline';
            spans[1].style.display = isLoading ? 'inline' : 'none';
            button.disabled = isLoading;
        }

        // Show Message
        function showMessage(message, type) {
            const msgDiv = document.getElementById('authMessage');
            msgDiv.textContent = message;
            msgDiv.className = `auth-message ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    msgDiv.className = 'auth-message';
                    msgDiv.textContent = '';
                }, 5000);
            }
        }

        // Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            
            isHandlingFormSubmit = true;
            setLoading(loginBtn, true);
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Get user data from Firestore
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                // FIX: If the user doc doesn't exist yet (e.g. legacy account),
                // create a minimal one instead of blocking login entirely.
                if (!userDoc.exists) {
                    await db.collection('users').doc(user.uid).set({
                        email: user.email,
                        name: user.displayName || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        hasAccess: false,
                        role: 'student',
                        enrolledCourses: [],
                        points: 0,
                        status: 'pending_enrollment'
                    });
                }

                const userData = userDoc.exists ? userDoc.data() : {};

                // Store user data in localStorage
                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: userData.name || user.displayName || '',
                    hasAccess: userData.hasAccess || false,
                    enrolledCourses: userData.enrolledCourses || [],
                    status: userData.status || 'pending_enrollment'
                }));
                
                showMessage('Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'enroll';
                }, 1500);
                
            } catch (error) {
                console.error('Login error:', error);
                isHandlingFormSubmit = false;
                
                let message = 'Login failed. ';
                switch (error.code) {
                    case 'auth/user-not-found':
                        message += 'No account found with this email.';
                        break;
                    case 'auth/wrong-password':
                        message += 'Incorrect password.';
                        break;
                    case 'auth/too-many-requests':
                        message += 'Too many failed attempts. Try again later.';
                        break;
                    default:
                        message += error.message;
                }
                
                showMessage(message, 'error');
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // Signup Form Submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const signupBtn = document.getElementById('signupBtn');
            
            if (!name) {
                showMessage('Please enter your full name.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            if (password.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                return;
            }
            
            isHandlingFormSubmit = true;
            setLoading(signupBtn, true);
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Update Firebase Auth display name
                await user.updateProfile({ displayName: name });
                
                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    email: email,
                    name: name,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    hasAccess: false,
                    role: 'student',
                    enrolledCourses: [],
                    points: 0,
                    referrals: [],
                    status: 'pending_enrollment'
                });

                // FIX: Enrollment document is required by resources's
                // checkEnrollmentStatus(). Without this, the user gets redirected
                // away from any course page immediately after signing up.
                // 
                // IMPORTANT: Replace 'YOUR_DEFAULT_COURSE_ID' below with your
                // actual course ID from Firestore (e.g. 'robotics-101').
                // If you have an enrollment/application flow on enroll,
                // you can remove this block and let that page create the document
                // instead — but it MUST exist with status: 'approved' before the
                // user can access resources.
                //
                // To find your course ID: Firestore Console → courses collection
                // → copy the document ID of the course you want.
                const DEFAULT_COURSE_ID = 'YOUR_DEFAULT_COURSE_ID'; // <-- replace this

                if (DEFAULT_COURSE_ID !== 'YOUR_DEFAULT_COURSE_ID') {
                    await db.collection('enrollments').add({
                        userId: user.uid,
                        courseId: DEFAULT_COURSE_ID,
                        status: 'approved',
                        enrolledAt: firebase.firestore.FieldValue.serverTimestamp(),
                        studentEmail: email,
                        studentName: name
                    });
                }
                
                // Store user data in localStorage
                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    name: name,
                    hasAccess: false,
                    status: 'pending_enrollment'
                }));
                
                showMessage('Account created successfully! Redirecting...', 'success');
                
                // Clear form
                document.getElementById('signupForm').reset();
                document.getElementById('passwordStrengthBar').className = 'password-strength-bar';
                document.getElementById('passwordMatch').textContent = '';
                
                setTimeout(() => {
                    window.location.href = 'enroll';
                }, 1500);
                
            } catch (error) {
                console.error('Signup error:', error);
                isHandlingFormSubmit = false;
                
                let message = 'Signup failed. ';
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        message += 'Email already registered.';
                        break;
                    case 'auth/invalid-email':
                        message += 'Invalid email address.';
                        break;
                    case 'auth/weak-password':
                        message += 'Password is too weak.';
                        break;
                    default:
                        message += error.message;
                }
                
                showMessage(message, 'error');
            } finally {
                setLoading(signupBtn, false);
            }
        });

        // FIX: Only auto-redirect if we're not already mid-submit.
        // Previously this fired during signup/login and caused a race condition.
        auth.onAuthStateChanged((user) => {
            if (user && !isHandlingFormSubmit) {
                db.collection('users').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        window.location.href = 'enroll';
                    }
                });
            }
        });

        // Check URL for signup tab
        if (window.location.hash === '#signup') {
            switchTab('signup');
        }
    </script>
</body>
</html>
